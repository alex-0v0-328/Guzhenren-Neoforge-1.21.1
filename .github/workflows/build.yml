name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: guzhenren-template-1.21.1
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        working-directory: guzhenren-template-1.21.1
        run: chmod +x ./gradlew

      - name: Build with Gradle
        working-directory: guzhenren-template-1.21.1
        run: ./gradlew build

      # src/generated/resources is a committed source set, and 'build' happily packs a stale one.
      # git diff alone would miss a provider change that ADDS a file, so this asks git status.
      - name: Generated resources are up to date
        working-directory: guzhenren-template-1.21.1
        run: |
          ./gradlew runData
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated is stale. Run ./gradlew runData and commit the result."
            git status --porcelain -- src/generated
            git --no-pager diff -- src/generated
            exit 1
          fi
